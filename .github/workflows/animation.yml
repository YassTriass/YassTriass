name: Generate README animation

on:
  push:
    paths:
      - "scripts/generate-animation.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVG
        run: npx -y tsx scripts/generate-animation.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet || git commit -m "chore: regenerate terminal animation"
          git push
